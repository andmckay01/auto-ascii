[package]
name = "auto-ascii-cli"
description = "auto-ascii agent-first CLI: import video into a library of ASCI clips, cut and compose them, play them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
auto-ascii = { path = "../auto-ascii", version = "0.2.0" }
auto-ascii-factory = { path = "../auto-ascii-factory" }
auto-ascii-core = { workspace = true }
auto-ascii-term = { workspace = true }
auto-ascii-format = { workspace = true }
clap = { workspace = true }
cpal = { version = "0.18", optional = true }
indicatif = { workspace = true }
libc = { workspace = true }
memmap2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
default = ["audio"]
audio = ["dep:cpal"]

[dev-dependencies]
auto-ascii-eval = { workspace = true }

[[bin]]
name = "auto-ascii"
path = "src/main.rs"
