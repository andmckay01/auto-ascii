[package]
name = "sleepy-player"
description = "Sleepytime terminal player: mmap asset -> viewport -> resample -> composite -> present (PLAN §3)"
version.workspace = true
edition.workspace = true
license.workspace = true

# PLAN §8: memmap2, clap, anyhow + the three libs.
[dependencies]
slpy-core = { workspace = true }
slpy-term = { workspace = true }
slpy-format = { workspace = true }
memmap2 = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[[bin]]
name = "sleepy-player"
path = "src/main.rs"

# M2 item E: criterion perf gates over the real player pipeline (PLAN §6).
# Thresholds live in perf/thresholds.toml; scripts/perf-gate.sh compares.
# M2 review fix: slpy-eval (fixture assets) + proptest arrived with the
# resize fuzz + pipeline-parity tests — the §6 invariants and the committed
# goldens must exercise THIS crate's Player, not a test-harness replica.
# (Dev-deps sit outside the package's own dep graph — no cycle.)
[dev-dependencies]
criterion = { workspace = true }
slpy-eval = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "pipeline"
harness = false
