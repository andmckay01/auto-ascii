[package]
name = "auto-ascii"
description = "Realtime ASCII-art video: play ASCI feature assets in a terminal, or render them into your own cell grid"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ascii", "terminal", "video", "tui", "ansi"]
categories = ["multimedia::video", "command-line-utilities", "rendering"]
readme = "README.md"

[lints]
workspace = true

[features]
default = ["bin", "compose"]
terminal = ["auto-ascii-term/session", "compose"]
bin = ["terminal", "dep:clap", "dep:anyhow"]
compose = ["dep:toml"]

[dependencies]
auto-ascii-core = { workspace = true }
auto-ascii-format = { workspace = true }
auto-ascii-term = { path = "../auto-ascii-term", version = "0.1.0", default-features = false }
memmap2 = { workspace = true }
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[[bin]]
name = "auto-ascii-player"
path = "src/bin/auto-ascii-player.rs"
required-features = ["bin"]

[[example]]
name = "simple-play"
required-features = ["terminal"]

[[example]]
name = "embedded-loop"

[[example]]
name = "headless-dump"

[dev-dependencies]
criterion = { workspace = true }
auto-ascii-eval = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "pipeline"
harness = false
