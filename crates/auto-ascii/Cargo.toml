[package]
name = "auto-ascii"
description = "Realtime ASCII-art video: play .ascii feature assets in a terminal, or render them into your own cell grid"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ascii", "terminal", "video", "tui", "ansi"]
categories = ["multimedia::video", "command-line-utilities", "rendering"]
readme = "README.md"

[lints]
workspace = true

[features]
default = ["terminal", "audio", "compose"]
terminal = ["auto-ascii-term/session", "compose"]
compose = ["dep:toml"]
audio = ["dep:cpal"]

[dependencies]
auto-ascii-core = { workspace = true }
auto-ascii-format = { workspace = true }
auto-ascii-term = { path = "../auto-ascii-term", version = "0.1.0", default-features = false }
memmap2 = { workspace = true }
toml = { workspace = true, optional = true }
cpal = { version = "0.18", optional = true }

[[example]]
name = "simple-play"
required-features = ["terminal"]

[[example]]
name = "embedded-loop"

[[example]]
name = "headless-dump"

[dev-dependencies]
criterion = { workspace = true }
auto-ascii-eval = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "pipeline"
harness = false
