[package]
name = "auto-ascii-term"
description = "Terminal backends for auto-ascii: Backend trait, ANSI backend, capability probe, headless simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["terminal", "ansi", "tui", "ascii", "capabilities"]
categories = ["command-line-interface", "rendering"]
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
auto-ascii-core = { workspace = true }
crossterm = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[features]
default = ["session"]
session = ["dep:crossterm", "dep:libc"]

[[bin]]
name = "auto-ascii-term-harness"
path = "src/bin/harness.rs"
doc = false
required-features = ["session"]

[dev-dependencies]
auto-ascii-eval = { workspace = true }
