[package]
name = "sleepy-factory"
description = "Sleepytime offline factory: ffmpeg ingest -> feature planes -> SLPY asset (PLAN §5)"
version.workspace = true
edition.workspace = true
license.workspace = true

# PLAN §8 lists image/imageproc/ndarray/rayon for the factory; M0 is luma-only
# (grayscale from ffmpeg rawvideo, no gradients, single-threaded encode), so
# per the M0 dependency guidance they are deferred until a stage needs them.
# M2 (item B) adds the eval driver: params.toml (serde/toml), the player
# pipeline reused verbatim (sleepy-player lib), SimBackend + metrics
# (slpy-term/slpy-core/slpy-eval), mmap'd asset reads (memmap2).
[dependencies]
slpy-format = { workspace = true }
slpy-core = { workspace = true }
slpy-term = { workspace = true }
slpy-eval = { workspace = true }
sleepy-player = { workspace = true }
clap = { workspace = true }
indicatif = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
memmap2 = { workspace = true }

[[bin]]
name = "sleepy-factory"
path = "src/main.rs"
