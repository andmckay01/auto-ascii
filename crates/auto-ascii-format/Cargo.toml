[package]
name = "auto-ascii-format"
description = "ASCI v1 chunked container for auto-ascii: deterministic writer, mmap-friendly reader, zstd + temporal delta, O(1) seek"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ascii", "terminal", "video", "format", "container"]
categories = ["multimedia::video", "encoding"]
readme = "../../README.md"

[lints]
workspace = true

# PLAN §8: zstd + crc32fast + ciborium (META only — frame payloads are
# hand-rolled fixed layout, not serde). serde only for the META struct.
[features]
default = []
# Compress a frame's plane subblocks concurrently. Byte-identical output either
# way (see `PlaneCodec` in write.rs) — this changes only how long it takes.
# Enabled by auto-ascii-factory; deliberately NOT default, so the player's
# dependency tree stays free of rayon.
parallel = ["dep:rayon"]

[dependencies]
zstd = { workspace = true }
rayon = { workspace = true, optional = true }
crc32fast = { workspace = true }
ciborium = { workspace = true }
serde = { workspace = true }
