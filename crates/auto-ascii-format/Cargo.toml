[package]
name = "auto-ascii-format"
description = "ASCI v1 chunked container for auto-ascii: deterministic writer, mmap-friendly reader, zstd + temporal delta, O(1) seek"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ascii", "terminal", "video", "format", "container"]
categories = ["multimedia::video", "encoding"]
readme = "../../README.md"

[lints]
workspace = true

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
zstd = { workspace = true }
rayon = { workspace = true, optional = true }
crc32fast = { workspace = true }
ciborium = { workspace = true }
serde = { workspace = true }
