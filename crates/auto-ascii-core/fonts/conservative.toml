# Glyph ink-coverage table (PLAN §3.4) — generated by `auto-ascii-factory font-table`.
# DO NOT EDIT: regenerate with the command in fonts/README.md.
# coverage = fraction of a 64x128 px cell covered by ink (antialiased integral);
# lstar = CIE L* of that coverage as linear luminance (white ink on black).
# `missing` lists palette glyphs absent from the font (coverage 0) — the
# repertoire gap the --font-table palette veto consumes.
