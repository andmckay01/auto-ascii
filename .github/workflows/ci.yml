name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # alsa-sys (cpal) links libasound via pkg-config; the factory and
      # stream tests shell out to a real ffmpeg.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The stream tests play real-time media against stall thresholds and
      # flake when they compete for the runner's CPUs, so they run serially.
      - name: Test
        run: cargo test --workspace -- --skip 'stream::'

      - name: Test stream (serial)
        run: cargo test -p auto-ascii --bin auto-ascii 'stream::' -- --test-threads=1
