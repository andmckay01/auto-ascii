[workspace]
resolver = "3"
members = [
    "crates/auto-ascii-format",
    "crates/auto-ascii-core",
    "crates/auto-ascii-term",
    "crates/auto-ascii-eval",
    "crates/auto-ascii-factory",
    "crates/auto-ascii",
    "crates/auto-ascii-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/andmckay01/auto-ascii"

[workspace.lints.clippy]
chunks_exact_to_as_chunks = "allow"

[workspace.dependencies]
auto-ascii-core = { path = "crates/auto-ascii-core", version = "0.1.0" }
auto-ascii-term = { path = "crates/auto-ascii-term", version = "0.1.0" }
auto-ascii-format = { path = "crates/auto-ascii-format", version = "0.1.0" }
auto-ascii-eval = { path = "crates/auto-ascii-eval" }
auto-ascii = { path = "crates/auto-ascii", default-features = false }
zstd = "0.13"
rayon = "1"
crc32fast = "1.4"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
indicatif = "0.18"
serde_json = "1"
memmap2 = "0.9"
anyhow = "1"
insta = "1"
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
image = { version = "0.25", default-features = false }
imageproc = { version = "0.25", default-features = false }
gif = "0.13"
ab_glyph = "0.2"

[profile.release]
opt-level = 3

[profile.dev.package.auto-ascii-core]
opt-level = 3
[profile.dev.package.auto-ascii-term]
opt-level = 3
[profile.dev.package.auto-ascii-format]
opt-level = 3
[profile.dev.package.auto-ascii-eval]
opt-level = 3
[profile.dev.package.zstd]
opt-level = 3
[profile.dev.package.zstd-safe]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
[profile.dev.package.auto-ascii]
opt-level = 3
[profile.dev.package.auto-ascii-factory]
opt-level = 3
