# M3 Tune, round 2 — axis 2: EMA alphas + bilateral strength (all factory
# knobs -> one asset build per value set; base = round-1 winner via
# --params). Value sets travel together (single axis, no cross):
#   1. round-1 carry-over (y700/e500/bp2) — the cached reference point
#   2. calmer EMA (the grass-flicker one-knob evidence: y500 -> 1.824)
#   3. calmer still
#   4. stronger orientation smoothing at default EMA (isolates bilateral)

[[axes]]
name = "temporal-and-bilateral"
values = [
  { "temporal.ema_alpha_y_milli" = 700, "temporal.ema_alpha_e_milli" = 500, "edges.bilateral_passes" = 2 },
  { "temporal.ema_alpha_y_milli" = 550, "temporal.ema_alpha_e_milli" = 400, "edges.bilateral_passes" = 2 },
  { "temporal.ema_alpha_y_milli" = 450, "temporal.ema_alpha_e_milli" = 350, "edges.bilateral_passes" = 2 },
  { "temporal.ema_alpha_y_milli" = 700, "temporal.ema_alpha_e_milli" = 500, "edges.bilateral_passes" = 3 },
]
