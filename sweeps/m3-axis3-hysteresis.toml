# M3 Tune, round 3 — axis 3: idx hysteresis width x HI_CUT (both runtime
# [compose] knobs -> zero factory rebuilds; base = round-2 winner params).
# idx_hyst_q8: 90 = the §3.5 spec default (0.35 step); wider = stickier
# cells (flicker down, responsiveness down). hi_cut_q8 gates how far up the
# ramp highlights may override.

[[axes]]
name = "idx-hysteresis-width"
values = [
  { "compose.idx_hyst_q8" = 90 },
  { "compose.idx_hyst_q8" = 115 },
  { "compose.idx_hyst_q8" = 140 },
]

[[axes]]
name = "highlight-cut"
values = [
  { "compose.hi_cut_q8" = 128 },
  { "compose.hi_cut_q8" = 160 },
  { "compose.hi_cut_q8" = 192 },
]
