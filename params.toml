# params.toml — every factory tunable (PLAN §5: "the agent socket").
#
# These are the embedded defaults: `auto-ascii-factory` compiles this exact file
# in via include_str! and uses it when --params is not given, so committed
# edits here change the default build. A --params FILE may override any
# subset (missing keys keep these values); `auto-ascii-factory params --dump`
# prints the effective merged config. A unit test pins this file to the
# in-code defaults — keep the two in sync deliberately.
#
# Determinism guard: building with defaults must stay byte-identical to the
# committed pipeline output (crates/auto-ascii-factory/tests/m2_params_eval.rs);
# editing [build]/[shots]/[levels]/[edges]/[highlights]/[temporal] is a
# deliberate re-baselining act.

[build]
# Output frame rate (ffmpeg fps filter; header fps_num, fps_den = 1).
fps = 30
# Stored plane resolution (PLAN §4 base res). Both dims MUST be even and
# >= 2 — the C chroma plane is stored at half res (INTERFACES §4 terms).
base_w = 480
base_h = 270
# zstd compression level for frame payloads. Lowered 19 -> 15 (2026-08-31)
# after an audited sweep on 600 real frames: L15 costs +0.91% asset bytes and
# builds 2.84x faster end-to-end. L12 is a dominated choice — it gives up
# +8% size for only 1.56x, while L12->L9 buys another 1.49x for just +1.1%
# more; anyone willing to pay L12's size should be at L9 instead.
# zstd is LOSSLESS, so decoded planes are byte-identical at any level: SSIM,
# edge F1, flicker and damage cannot move. Only size and build time do.
# NOTE: auto-ascii-format's `WriterOptions::default()` deliberately stays at 19 —
# the format crate's default is not the factory's policy.
zstd_level = 15
# Keyframe cadence for the temporal-delta filter (PLAN §4: 60).
# Range 1..=255 — the ASCI header stores this as u8.
keyframe_ivl = 60

[shots]
# Cut threshold in thousandths of the max possible histogram SAD (PLAN §5
# stage 2). Real hard cuts land ~500-1200, in-shot motion ~20-150.
sad_threshold_milli = 300
# Minimum shot length in frames (debounces flashes/strobes).
min_shot_frames = 8

[levels]
# Per-shot percentile levels stored in NORM (PLAN §5 stage 5: p2/p98).
lo_pct = 2
hi_pct = 98

[edges]
# PLAN §5 stage 3 (M3): Scharr on the stored (EMA'd) L* plane -> doubled-
# angle field -> orientation-aware bilateral smoothing -> hysteresis-
# thresholded UNTHINNED edge magnitude E + Ex/Ey (bias-128).
#
# Right-shift on the raw Scharr magnitude. At 4 (tap sum 16) a sharp step
# edge of L* contrast D scores E ~= D, so t_hi/t_lo read as L* contrast;
# soft (2 px) video edges score roughly D/2.
scharr_shift = 4
# Orientation-aware bilateral passes on the doubled-angle field (PLAN §5:
# two; full Kang ETF only if the flicker metric later demands it).
bilateral_passes = 2
# Bilateral window radius in pixels (window = 2r+1 square).
bilateral_radius = 2
# Hysteresis on the smoothed magnitude: >= t_hi seeds an edge; t_lo..t_hi
# pixels survive only when 8-connected to a seed (Canny-style, unthinned).
# Eyeballed on the corpus: 28/12 traces sheep outlines + silhouette limbs
# while keeping grass-blade speckle out of the seed set.
t_hi = 28
t_lo = 12

[highlights]
# H plane flags (PLAN §5 stage 3, M3): bit0 highlight, bit1 deep shadow —
# detected offline (far stabler than runtime thresholding), from the EMA'd
# Y plane.
#
# White top-hat = luma - opening(luma) with a box SE of this radius:
# features wider than ~2r+1 px are "bright areas", not highlights.
tophat_radius = 3
# Minimum top-hat response (L* units above the local opening) for bit0.
tophat_thresh = 48
# Deep shadow: darkest shadow_pct% of the frame, capped at shadow_max_l
# (bright scenes must never flag midtones as shadow):
# flagged iff y <= min(percentile(shadow_pct), shadow_max_l).
shadow_pct = 8
shadow_max_l = 40

[temporal]
# Per-plane EMA (PLAN §5 stage 4; the first line of anti-flicker defense),
# reset at shot cuts. Alpha = weight of the NEW frame in thousandths
# (1000 = no smoothing). Y/C stay light (heavy smoothing ghosts motion);
# E/Ex/Ey smooth harder — edge shimmer is the #1 flicker source and the
# player's dual-threshold edge gate rides the EMA decay.
ema_alpha_y_milli = 700
ema_alpha_e_milli = 500
ema_alpha_c_milli = 700

[compose]
# The player's per-cell §3.5 compositor tunables (M3). RENDERER knobs:
# the eval driver hands these to the Player, so tuning them never rebuilds
# assets (excluded from the build fingerprint / eval cache key). Defaults
# are pinned to auto_ascii_core::ComposeParams::default() by unit test —
# interactive playback (no params.toml) starts from the same baseline.
#
# Edge gate on/hold thresholds (strict >) on the box-resampled E plane.
# NOTE the scale: factory E ~= L* contrast (t_hi seeds at 28, corpus max
# ~130) diluted by the cell box average — NOT a full 0..255 range. 32/16
# picked by corpus sweep at M3 integration (grass F1 0.72 @ 32, precision
# 0.77; 0.52 @ 40; 0.00 @ 96 — coherence gates carry noise suppression).
edge_t_on = 32
edge_t_off = 16
# Coherence bands (Q8): < coh_min suppresses the edge layer, coh_min..coh_dir
# draws the junction glyph, >= coh_dir draws directional glyphs (§3.3).
coh_min_q8 = 96
coh_dir_q8 = 160
# Highlight fires only while base idx < len * hi_cut_q8 / 256 (§3.5 HI_CUT).
hi_cut_q8 = 160
# Edge never overrides a near-white base cell (§3.4); 240 = the top step.
edge_white_cut_q8 = 240
# |top - bottom| >= this is "large": half-block / quadrant / subposition.
halfblock_min_delta = 64
# ASCII junction '+' upgrades to '#' at/above this magnitude.
edge_strong = 96
# Quadrant-refinement NOISE floor (arm/hold, strict >), unicode tiers only.
# Coherence divides by max(E, 1), so a 1-LSB resample-noise (Ex,Ey) vector
# over E 0..1 reads as perfectly coherent and would pick a noise-driven
# corner quadrant. This is a noise floor, NOT a second edge gate: resampled
# E is diluted by the cell box average (corpus source E mean 3.6, 8.95%
# nonzero), so a genuine fine diagonal lands near cell E 6-11 — raising this
# to the edge gate's hold threshold (16) would silently downgrade the whole
# band quadrants exist for. Dual threshold so a cell dithering across the
# floor cannot alternate quadrant/half-block every frame.
quad_e_on = 2
quad_e_off = 1
# Ramp-index hysteresis width, Q8 fractions of one ramp step. The §3.5 spec
# nominal is "boundary +/- 0.35 step" = 90 (auto_ascii_core::IDX_HYST_Q8); promoted
# to a tunable at M3 Tune and RE-TUNED to 160 (0.625 step) by the committed
# corpus sweep (sweeps/m3-axis3 + Tune-finish, composite score 0.4160 vs
# 0.3932 @ 90): grass flicker 2.313 -> 1.651 (the <= 2 gate breach fixed),
# sheep 1.361 -> 1.288, silhouette 1.553 -> 1.599, edge F1 byte-identical on
# all three clips (the near-white veto rides the PLAIN index since Tune),
# mean ssim flat (0.6167 -> 0.6164). 0..=255; < 1 full step by contract.
idx_hyst_q8 = 160
# Shadow lift: bends the per-shot NORM levels LUT toward the shadows so a dark
# subject clears the first ramp steps instead of sharing a glyph with black.
# 0 = off (plain linear window), 255 = a full sqrt curve; endpoints are fixed
# points, so it opens shadows without raising black or clipping white.
#
# Off by default: the corpus was tuned and signed off without it, and every
# committed golden assumes the plain window. It is a per-clip choice — turn it
# live in the player with `d` to select and `[`/`]` to adjust.
shadow_lift = 0

[eval]
# Terminal grid the eval render runs on (PLAN §6 reference scale).
grid_cols = 300
grid_rows = 80
# Frames evaluated per clip per tier (0 = all frames).
max_frames = 900
# Downscale-SSIM is sampled every N-th frame (it is the expensive metric).
ssim_every = 30
# Contact-sheet snapshots per clip (source vs render, spread over the run).
contact_frames = 3

[eval.tolerances]
# Baseline-compare tolerances (auto-ascii-eval Tolerances; any subset overridable).
ssim_max_drop = 0.02
flicker_max_increase = 0.5
# M3: edge F1 vs source Canny (absolute drop; higher F1 always passes). The
# aesthetic-regression drill rides this gate — an absurd edge T_on collapses
# F1 and must exit nonzero against the baseline.
edge_f1_max_drop = 0.05
bytes_frac_max_increase = 0.20
damage_rate_max_increase = 0.05
# INFORMATIONAL band only (M2-low fix b): stage times are wall-clock on a
# shared box and never gate the compare — beyond this fractional increase
# the report earns an `info:` note. The criterion perf gate is the precise
# instrument for stage-time regressions.
stage_ms_frac_max_increase = 0.50
# Asset-structure gates (M2 review fix: factory-tunable regressions —
# shot/cut roster changes, keyframe-cadence drops, encode bloat — must trip
# the compare even when render-side metrics stay flat).
shot_structure_max_delta = 0.0
keyframes_frac_max_drop = 0.0
asset_bytes_frac_max_increase = 0.20
